<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>日文練習</title>
<style>
body{
    background:#121212;
    color:#e0e0e0;
    font-family:sans-serif;
    margin:0;
    padding:14px;
    touch-action: manipulation;
}
h1{text-align:center;color:#90caf9;font-size:22px;}
.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
    margin-bottom:10px;
}
button,select{
    background:#1e1e1e;
    color:#e0e0e0;
    border:1px solid #333;
    border-radius:6px;
    padding:8px 12px;
    font-size:14px;
    cursor:pointer;
}
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
    gap:10px;
}
.card{
    background:#1e1e1e;
    border:1px solid #333;
    border-radius:10px;
    padding:12px;
    text-align:center;
}
.kana{font-size:26px;font-weight:bold;}
.roma{font-size:13px;color:#aaa;}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:center;
    justify-content:center;
}
.quizBox{
    background:#1e1e1e;
    border-radius:12px;
    padding:18px;
    width:90%;
    max-width:360px;
    text-align:center;
}
.question{font-size:24px;margin-bottom:8px;}
.quizControls{
    display:flex;
    justify-content:flex-end;
    margin-bottom:8px;
}
.choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.choice{
    background:#121212;
    border:1px solid #333;
    border-radius:8px;
    padding:12px;
    font-size:20px;
    transition: background 0.3s;
}

/* 錯題檢視 */
.reviewOverlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.85);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
}
.reviewBox{
    background:#1e1e1e;
    width:90%;
    max-width:380px;
    max-height:80vh;
    overflow-y:auto;
    border-radius:12px;
    padding:16px;
}
.reviewItem{
    border-bottom:1px solid #333;
    padding:12px 0;
}
.reviewWrong{color:#ef5350;}
.reviewCorrect{color:#81c784;}
.roma-word{
    font-size:12px;
    color:#aaa;
}
</style>
</head>

function loadData(){
    const lv = level.value;

    if(lv === "allCombined"){
        // 合併所有分類單字（保持每行資料獨立）
        pool = [
          ...data.basic,
          ...data.daku,
          ...data.you,
          ...data.basic1,
          ...data.daku1,
          ...data.you1,
          ...data.basicResponse,
          ...data.position,
          ...data.actions,
          ...data.family,
          ...data.fps,
          ...data.emotion,
        ];
    } else if(lv === "all"){
        pool = [...data.words];
    } else if(lv === "kanaAll") {
        pool = [...data.basic, ...data.daku, ...data.you, ...data.basic1, ...data.daku1, ...data.you1 ];
    } else {
        pool = [...data[lv]];
    }

    if(orderRandom) pool.sort(() => Math.random() - 0.5);

grid.innerHTML = "";
pool.forEach(k => {
    const c = document.createElement("div");
    c.className = "card";

if(k.length >= 3){
    c.innerHTML = `
      <p>
        <strong>${k[0]}</strong><br>
        <span class="roma-word">(${k[1]})</span><br>
        ${k[2]}
      </p>
    `;
} else {
    c.innerHTML = `<p><strong>${k[0]}</strong><br>${k[1]}</p>`;
}
    grid.appendChild(c);
});
}

function startQuiz(t, m) {
    quizType = t;
    quizMode = m;
    questionIndex = 0;
    examScore = 0;
    wrongList = [];
    answerList = [];

    let availableQuestions = pool.length;

if (quizMode === "exam") {
    // 題目數 = 單字總數 + 0（也就是全部題庫）
    const numQuestions = availableQuestions; // 原本減1的地方去掉
    quizPool = [...pool].sort(() => Math.random() - 0.5).slice(0, numQuestions);
}
 else {
        // 練習模式：整個題庫、隨機
        quizPool = [...pool].sort(() => Math.random() - 0.5);
    }

    modal.style.display = "flex";
    grid.style.display = "none";
    nextQuestion();
}

function stopQuiz() {
    modal.style.display = "none";
    grid.style.display = "grid";
    loadData();

    const answered = answerList.length;       // 已作答題數
    const correct = examScore;                // 答對題數

    if (quizMode === "exam" || quizMode === "practice") {
        if (wrongList.length) showReview();  // 無論考試或練習，只要有錯題就顯示

        if (quizMode === "exam") {
            alert(`考試結束：${correct}/${quizPool.length} （已答題：${answered}）`);
        } else if (quizMode === "practice") {
            alert(`練習結束：${correct}/${answered}`);
        }
    }
}

function nextQuestion() {
if (questionIndex >= quizPool.length) {
    if (quizMode === "exam") {
        stopQuiz();
        return;
    } else {
        // 練習模式：重新洗牌、從頭來
        questionIndex = 0;
        quizPool.sort(() => Math.random() - 0.5);
    }
}
    answer = quizPool[questionIndex];
    questionIndex++;

question.innerHTML =
    quizType === "roma"
    ? `${quizMode === "exam" ? questionIndex + ". " : ""}${answer[0]}<br><span style="font-size:14px;color:#aaa;">（${answer[2]||""}）</span>`
    : `${quizMode === "exam" ? questionIndex + ". " : ""}${answer[1]}<br><span style="font-size:14px;color:#aaa;">（${answer[2]||""}）</span>`;

    const box = choices;
    box.innerHTML = "";

    const opts = [answer];
    while (opts.length < 4) {
        const r = pool[Math.floor(Math.random() * pool.length)];
        if (!opts.includes(r)) opts.push(r);
    }
    opts.sort(() => Math.random() - 0.5);

opts.forEach((o, i) => {
        const b = document.createElement("div");
        b.className = "choice";
        b.innerText = `${i + 1}. ` + (quizType === "roma" ? o[1] : o[0]);
        b.innerText = `${i + 1}. ` + (quizType === "roma" ? o[1] : o[0]);
        b.dataset.correct = (o === answer);
b.onclick = () => {
if (quizMode === "practice") {
    if (b.dataset.locked === "true") return;
    Array.from(box.children).forEach(c => c.dataset.locked = "true");

    const isCorrect = (o === answer);

    // 記錄作答
    const record = {
        qNum: questionIndex,
        kana: answer[0],
        roma: answer[1],
        mean: answer[2] || "",
        chosenText: quizType === "roma" ? o[1] : o[0],
        chosenMean: o[2] || "",
        correctText: quizType === "roma" ? answer[1] : answer[0],
        correctMean: answer[2] || "",
        mode: quizType,
        correct: isCorrect
    };
    answerList.push(record);

    // 答對累加
    if (isCorrect) examScore++;
    else wrongList.push(record); // ← 把錯題加入 wrongList

    // 顯示顏色提示
    if (isCorrect) {
        b.style.backgroundColor = "#81c784";
    } else {
        b.style.backgroundColor = "#ef5350";
        Array.from(box.children).forEach(c => {
            if (c.dataset.correct === "true") c.style.backgroundColor = "#81c784";
        });
    }

    setTimeout(nextQuestion, 600);
}

    // 考試模式維持原本行為
    if (quizMode === "exam") {
        const isCorrect = (o === answer);
        answerList.push({
            qNum: questionIndex,
            kana: answer[0],
            roma: answer[1],
            mean: answer[2] || "",
            chosenText: quizType === "roma" ? o[1] : o[0],
            chosenMean: o[2] || "",
            correctText: quizType === "roma" ? answer[1] : answer[0],
            correctMean: answer[2] || "",
            mode: quizType,
            correct: isCorrect
        });
        if (!isCorrect) wrongList.push(answerList.at(-1));
        if (isCorrect) examScore++;
        nextQuestion();
    }
};
        box.appendChild(b);
    });
}

function showReview() {
    const overlay = document.createElement("div");
    overlay.className = "reviewOverlay";
    const box = document.createElement("div");
    box.className = "reviewBox";
    box.innerHTML = "<h3>❌ 錯誤題目</h3>";

    let wrongCounter = 0;

    answerList.forEach((w) => {
        const questionDisplay = w.mode === "roma" ? `${w.kana}（${w.mean}）` : `${w.roma}（${w.mean}）`;
        const chosenDisplay = `${w.chosenText}（${w.chosenMean}）`;
        const answerDisplay = w.mode === "roma" ? `${w.roma}（${w.mean}）` : `${w.kana}（${w.mean}）`;

        // 題號遞增
        wrongCounter++;

        box.innerHTML += `
        <div class="reviewItem">
            第${wrongCounter}題<br>
            ${questionDisplay}<br>
${w.correct
  ? `<span class="reviewCorrect">你選：${chosenDisplay}</span>`
  : `
    <span class="reviewWrong">你選：${chosenDisplay}</span><br>
    <span class="reviewCorrect">正確：${answerDisplay}</span>
  `
}
        </div>`;
    });

    const btn = document.createElement("button");
    btn.innerText = "關閉";
    btn.onclick = () => overlay.remove();
    box.appendChild(btn);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
}

loadData();
